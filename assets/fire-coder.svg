  <text x="378" y="160" font-family="Consolas, monospace" font-size="20" fill="#F8FAFC">console.log("again?");</text>
  <text x="378" y="195" font-family="Consolas, monospace" font-size="20" fill="#FBBF24">fix(); coffee++;</text>
  <text x="350" y="230" font-family="Consolas, monospace" font-size="20" fill="#38BDF8">}<tspan class="cursor">_</tspan></text>

