<svg width="780" height="330" viewBox="0 0 780 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .flame { transform-origin: 170px 78px; animation: flicker 1.15s infinite ease-in-out; }
    .flame2 { transform-origin: 176px 92px; animation: flicker 1.45s infinite ease-in-out reverse; }
    .cursor { animation: blink 1s infinite steps(2); }
    .steam { animation: rise 2.4s infinite ease-in-out; opacity: .7; }
    @keyframes flicker {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: .94; }
      50% { transform: scale(1.08) rotate(2deg); opacity: 1; }
    }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
    @keyframes rise {
      0% { transform: translateY(12px); opacity: 0; }
      45% { opacity: .8; }
      100% { transform: translateY(-16px); opacity: 0; }
    }
  </style>

  <rect width="780" height="330" rx="24" fill="#061726"/>
  <rect x="24" y="24" width="732" height="282" rx="18" fill="#0D1117" stroke="#243B55" stroke-width="2"/>

